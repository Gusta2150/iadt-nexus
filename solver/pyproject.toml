[project]
name = "acuria"
version = "1.0.0"
description = "Otimização de modelos de diagnóstico com algoritmo genético"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.10",
  "httpx>=0.27",
  "scikit-learn>=1.5",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore::sklearn.exceptions.ConvergenceWarning",
  "ignore:.*penalty.*:FutureWarning",
]

[tool.setuptools.packages.find]
include = ["acuria*"]
